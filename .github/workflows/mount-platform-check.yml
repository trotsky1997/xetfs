name: Mount platform check
on:
  push:
    branches: [macos-fskit-support]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq && sudo apt-get install -y fuse3
      - run: sudo modprobe fuse && test -c /dev/fuse && ls -l /dev/fuse
      - run: cargo build --release --locked
      - run: python3 scripts/mount_acceptance.py ./target/release/xetfs --report results/linux-acceptance.json
      - run: python3 scripts/mount_dedup_benchmark.py ./target/release/xetfs --report results/linux-dedup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-mount-results
          path: results/
          if-no-files-found: warn
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          $env:CARGO_TERM_COLOR = 'never'
          cargo check --locked --no-default-features --lib *> results/windows-build.log
          $code = $LASTEXITCODE
          Get-Content results/windows-build.log
          if ($code -ne 0) { exit $code }
          if (-not (Test-Path 'src/windows_fuse.rs')) {
            Write-Error 'Windows mount backend is not present; mount, read/write and deduplication checks require it.'
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-results
          path: results/
