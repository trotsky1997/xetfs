name: Mount platform check
on:
  push:
    branches: [windows-acl-symlink-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WinFsp
        run: choco install winfsp -y --version=2.0.23075
      - name: Build Windows executable
        run: cargo build --locked --no-default-features
      - name: Mount, read/write, remount and measure deduplication
        run: python scripts/windows_mount_acceptance.py target/debug/xetfs.exe --report results/windows-mount.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-mount-results
          path: results/
