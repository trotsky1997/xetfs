[package]
name = "xetfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A local content-addressed, deduplicating filesystem using Xet algorithms"
license = "Apache-2.0"

[features]
default = ["fuse"]
fuse = ["dep:fuser"]

[dependencies]
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
globset = "=0.4.19"
hf-hub = { version = "=1.0.0", features = ["blocking", "rustls-tls"] }
gearhash = "=0.1.4"
libc = "0.2"
lz4_flex = "0.11"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.16", optional = true, default-features = false, features = ["abi-7-31"] }

[profile.release]
lto = "thin"
strip = true

